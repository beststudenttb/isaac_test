params:
  seed: 1

  env:
    clip_observations: 255.0
    clip_actions: 1.0
    obs_groups:
      obs: ["policy"]
      states: ["critic"]
    concate_obs_groups: true

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: true

    cnn:
      type: conv2d
      permute_input: false
      activation: relu
      initializer:
        name: default
      regularizer:
        name: None
      convs:
        - filters: 32
          kernel_size: 8
          strides: 4
          padding: 0
        - filters: 64
          kernel_size: 4
          strides: 2
          padding: 0
        - filters: 64
          kernel_size: 3
          strides: 1
          padding: 0

    mlp:
      units: [512]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: lstm
      units: 256
      layers: 1
      before_mlp: false
      layer_norm: true
      zero_rnn_on_done: true

  load_checkpoint: false
  load_path: ''

  config:
    name: ball_camera_lstm_asym
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: false
    normalize_value: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 50
    save_frequency: 50
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 64
    minibatch_size: 2048
    mini_epochs: 4
    critic_coef: 2.0
    clip_value: true
    seq_length: 8
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 2048
      mini_epochs: 4
      learning_rate: 1e-4
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.008
      clip_value: true
      normalize_input: true
      truncate_grads: true

      network:
        name: actor_critic
        central_value: true
        mlp:
          units: [256, 128, 64]
          activation: elu
          d2rl: false
          initializer:
            name: default
          regularizer:
            name: None

    player:
      deterministic: true
      games_num: 100000
      print_stats: true
